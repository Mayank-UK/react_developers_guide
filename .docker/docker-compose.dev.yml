services:
  app:
    build:
      context: ..                          # project root is the build context
      dockerfile: .docker/Dockerfile.dev   # path relative to context
    image: my-react-app-dev
    container_name: my-react-app-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ..:/app                  # relative paths in volumes are relative to this compose file
      - /app/node_modules
    environment:
      - NODE_ENV=development